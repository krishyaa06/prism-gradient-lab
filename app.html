    <section class="grid lab">
      <div class="card stage-card">
        <div class="stage" id="stage"><div class="stage-text"><b>Prism Protocol</b><span>Build. Create. Compete.</span></div></div>
        <div class="bar-wrap"><div class="bar" id="bar" title="Click to add a stop"></div><div id="handles"></div></div>
        <div class="row presets" id="presets"></div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-title"><h2>Type</h2><div class="tabs" id="type"><button class="on" data-v="linear">Linear</button><button data-v="radial">Radial</button><button data-v="conic">Conic</button></div></div>
          <label class="field" id="angleF">Angle <span class="mono" id="angleV"></span><input type="range" id="angle" min="0" max="360" /></label>
          <div class="grid g2 pos" id="posF"><label class="field">Center X<input type="range" id="cx" min="0" max="100" /></label><label class="field">Center Y<input type="range" id="cy" min="0" max="100" /></label></div>
        </div>
        <div class="card">
          <div class="card-title"><h2>Color stops</h2><button class="btn small" id="add">+ Stop</button></div>
          <div id="stops" class="stops"></div>
        </div>
        <div class="card">
          <div class="card-title"><div class="tabs" id="out"><button class="on" data-v="css">CSS</button><button data-v="tw">Tailwind</button></div><div class="row"><button class="btn small" id="rand">Random</button><button class="btn small" id="share">Share link</button><button class="btn small primary" id="copy">Copy</button></div></div>
          <pre class="out code-out" id="code"></pre>
        </div>
      </div>
    </section>
